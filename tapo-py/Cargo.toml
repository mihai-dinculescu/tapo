[package]
name = "tapo-py"
version = "0.8.10"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "tapo"
crate-type = ["cdylib"]
doc = false

[features]
default = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
log = { workspace = true }
pyo3 = { workspace = true, features = [
    "anyhow",
    "chrono",
    "chrono-tz",
    "experimental-async",
    "extension-module",
    "multiple-pymethods",
    "py-clone",
] }
pyo3-async-runtimes = { version = "0.30", features = ["attributes", "tokio-runtime"] }
pyo3-log = { version = "0.13" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync"] }

tapo = { path = "../tapo", features = ["debug", "python", "bluetooth"] }

# Bluetooth on Linux talks to BlueZ over D-Bus. Building libdbus into the
# wheel keeps the wheels free of a system libdbus, also when cross-compiled.
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }
